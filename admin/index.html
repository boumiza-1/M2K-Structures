const U="https://jezfuhwstngyfhycyydj.supabase.co",K="sb_publishable_PfnGkahwQRughnEDRIX8gA_otnJ0wud";const $=id=>document.getElementById(id);let token=null,rows=[],timer;const msg=t=>$('message').textContent=t;async function api(path,opts={}){let r=await fetch(U+path,{...opts,headers:{apikey:K,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...opts.headers}});if(!r.ok)throw Error('Requête refusée ('+r.status+')');return r.status===204?null:r.json()}function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;$('counts').textContent=rows.length+' demande(s) · '+rows.filter(r=>r.status==='Nouvelle').length+' nouvelle(s)';$('list').replaceChildren();for(let r of rows.filter(r=>(!f||r.status===f)&&[r.name,r.phone,r.email,r.service,r.location,r.details].join(' ').toLowerCase().includes(q))){let card=el('article','');card.append(el('h2',r.name),el('p',new Date(r.created_at).toLocaleString('fr-TN',{timeZone:'Africa/Tunis'})+' · '+r.service+' · '+r.location),el('p',r.phone+' · '+(r.email||'Aucun e-mail')),el('p',r.details));let phone=r.phone.replace(/[^0-9+]/g,'');if(/^\+?\d{5,15}$/.test(phone)){let a=el('a','Appeler');a.href='tel:'+phone;let w=el('a','WhatsApp');let n=phone.replace(/^\+/,'');if(n.length===8)n='216'+n;w.href='https://wa.me/'+n;w.target='_blank';w.rel='noopener noreferrer';card.append(a,document.createTextNode(' · '),w)}let s=el('select','');s.setAttribute('aria-label','Statut');for(let v of ['Nouvelle','En cours','Traitée']){let o=el('option',v);o.value=v;s.append(o)}s.value=r.status;s.onchange=async()=>{s.disabled=true;try{await api('/rest/v1/devis?id=eq.'+encodeURIComponent(r.id),{method:'PATCH',body:JSON.stringify({status:s.value}),headers:{Prefer:'return=minimal'}});await load()}catch(e){msg(e.message);s.value=r.status}finally{s.disabled=false}};card.append(s);$('list').append(card)}}
async function load(){if(!token)return;try{let all=[],offset=0;while(true){let batch=await api('/rest/v1/devis?select=*&order=created_at.desc,id.desc&limit=500&offset='+offset);all.push(...batch);if(batch.length<500)break;offset+=500}if(!token)return;rows=all;render();msg('')}catch(e){msg('Impossible de charger les demandes. Reconnectez-vous si nécessaire.')}}$('auth').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{let d=new FormData(e.target),s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:d.get('email'),password:d.get('password')})});if(String(s.user?.app_metadata?.m2k_admin)!=='true')throw Error('Compte non autorisé');token=s.access_token;e.target.reset();$('login').hidden=true;$('dashboard').hidden=false;await load();clearInterval(timer);timer=setInterval(load,30000)}catch(e){msg('Connexion impossible ou compte non autorisé.')}finally{b.disabled=false}};$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;$('logout').onclick=async()=>{clearInterval(timer);try{await api('/auth/v1/logout',{method:'POST'})}catch{}token=null;rows=[];$('list').replaceChildren();$('counts').textContent='';$('dashboard').hidden=true;$('login').hidden=false;msg('Déconnecté.')};
